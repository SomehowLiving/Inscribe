<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentForge Studio — Agent-Native Web IDE</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
</head>
<body>
  <div id="app">
    <header class="forge-header">
      <div class="brand">
        <span class="logo">🔥</span>
        <div>
          <h1>AgentForge Studio</h1>
          <span class="badge">WebMCP Native</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-demo" class="btn btn-primary">▶ Launch Demo Agent</button>
        <button id="btn-clear-log" class="btn btn-ghost">Clear Log</button>
        <div class="status-indicator" id="webmcp-status">
          <span class="dot"></span>
          <span class="label">WebMCP Active</span>
        </div>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel panel-files">
        <div class="panel-header">
          <span>📁 Files</span>
          <button id="btn-new-file" class="btn-icon" title="New File">+</button>
        </div>
        <div id="file-tree" class="file-tree"></div>
      </aside>

      <main class="panel panel-main">
        <div class="tabs" id="editor-tabs">
          <div class="tab active" data-path="/welcome.md">welcome.md</div>
        </div>
        <div class="editor-container">
          <textarea id="editor" class="editor" spellcheck="false"></textarea>
          <iframe id="preview" class="preview" sandbox="allow-scripts allow-same-origin" title="Live preview"></iframe>
          <div id="sandbox-wrapper" style="display:none;">
            <iframe id="sandbox-frame" src="sandbox.html" sandbox="allow-scripts allow-same-origin" title="Code sandbox"></iframe>
          </div>
        </div>
      </main>

      <aside class="panel panel-inspector">
        <div class="panel-header">
          <span>🔮 WebMCP Inspector</span>
        </div>
        <div class="inspector-content">
          <div class="inspector-section">
            <h3>Registered Tools <span id="tool-count" class="count">0</span></h3>
            <div id="tool-list" class="tool-list"></div>
          </div>
          <div class="inspector-section">
            <h3>Recent Calls</h3>
            <div id="call-log" class="call-log"></div>
          </div>
        </div>
      </aside>
    </div>

    <div class="bottom-panels">
      <div class="panel panel-terminal">
        <div class="panel-header">
          <span>💻 Terminal</span>
          <button id="btn-clear-term" class="btn-icon">⌫</button>
        </div>
        <div id="terminal" class="terminal"></div>
      </div>
      <div class="panel panel-chat">
        <div class="panel-header">
          <span>💬 Agent Chat</span>
          <button id="btn-stop-agent" class="btn-icon" title="Stop agent" hidden>⏹</button>
        </div>
        <div id="chat-log" class="chat-log"></div>
        <form id="agent-form" class="agent-form">
          <select id="agent-model" title="Model"></select>
          <input id="agent-goal" type="text" placeholder="Give the agent a real task, e.g. 'Build a pricing page'" autocomplete="off" />
          <button type="submit" id="btn-agent-send" class="btn btn-primary">Run Agent</button>
        </form>
      </div>
    </div>
  </div>

  <div id="demo-overlay" class="demo-overlay hidden">
    <div class="demo-modal">
      <h2>🤖 Demo Agent Running</h2>
      <p>Watch an AI agent build a complete website using only WebMCP tool calls.</p>
      <div class="demo-progress">
        <div class="demo-bar" id="demo-bar"></div>
      </div>
      <div id="demo-status" class="demo-status">Initializing...</div>
      <button id="btn-stop-demo" class="btn btn-danger">Stop Demo</button>
    </div>
  </div>

  <script src="vfs.js"></script>
  <script src="webmcp.js"></script>
  <script src="demo-agent.js"></script>
  <script src="real-agent.js"></script>
  <script src="app.js"></script>
</body>
</html>
